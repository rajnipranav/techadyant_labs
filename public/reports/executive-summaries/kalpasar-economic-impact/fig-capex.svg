<text x="28" y="262" font-size="11" fill="#94a3b8">Closure-dam civil works is the largest package; environmental management rose to Rs 12,800 cr (9.6%) reflecting unresolved ecological objections - incl. Rs 2,800 cr R&amp;R for ~30 villages.</text>
<text x="28" y="284" font-size="11" fill="#94a3b8">Indo-Dutch methodology (Afsluitdijk, Delta Works precedent); 6-8 m tidal range, monsoon-window gap closure.</text></svg>
