<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-label="480 billion dollar localisation envelope versus 5.6 trillion dollars of strategic imports" font-family="Inter, Arial">
<text x="20" y="40" font-size="12" fill="#94a3b8">The envelope, FY2026–35 (US$ billion)</text>
<rect x="170.0" y="20" width="300" height="220" rx="10" fill="#3b82f6"/>
<text x="320.0" y="8" font-size="20" font-weight="700" fill="#f1f5f9" text-anchor="middle">$5,600B</text>
<text x="320.0" y="258" font-size="12.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Strategic imports (status quo)</text>
<text x="320.0" y="276" font-size="11" fill="#cbd5e1" text-anchor="middle">8.6% of the import surface</text>
<rect x="530.0" y="221.14285714285714" width="300" height="18.857142857142858" rx="10" fill="#f59e0b"/>
<text x="680.0" y="209.14285714285714" font-size="20" font-weight="700" fill="#f1f5f9" text-anchor="middle">$480B</text>
<text x="680.0" y="258" font-size="12.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Localisation capex envelope</text>
<text x="680.0" y="276" font-size="11" fill="#cbd5e1" text-anchor="middle">largely private, phased</text>
<text x="20" y="295" font-size="11" fill="#cbd5e1">Economically rational before multipliers, employment, exports and the sovereignty dividend.</text>
</svg>
