<text x="36" y="188" font-size="12" font-weight="700" fill="#f59e0b">WHY IT MATTERS</text>
<text x="36" y="208" font-size="11" fill="#f1f5f9">Rank by strategic danger, not import value: a $400M single-source EUV-photoresist import outranks a $4B commodity.</text>
<text x="36" y="224" font-size="11" fill="#cbd5e1">Chokepoints first → then volume. Every score is a localisation priority, not a trade statistic.</text>
