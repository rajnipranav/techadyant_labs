<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-label="India HSM installed base: 92 percent foreign today, 35 percent domestic target by 2030" font-family="Inter, Arial">
<rect x="0" y="0" width="1000" height="280" fill="transparent"/>
<text x="28" y="36" font-size="15" font-weight="700" fill="#f1f5f9">India HSM installed base - today vs 2030 target</text>
<text x="28" y="72" font-size="11.5" font-weight="700" fill="#f1f5f9">Today: domestic share under 8%</text>
<rect x="28" y="84" width="944" height="24" rx="6" fill="#151f2e" stroke="#475569" stroke-width="1"/>
<rect x="30" y="86" width="868" height="20" rx="5" fill="#ef4444"/>
<rect x="898" y="86" width="76" height="20" rx="5" fill="#34d399"/>
<text x="600" y="100" font-size="11" font-weight="700" fill="#0b1220">92% foreign - Thales ~34%, Entrust, Utimaco</text>
<text x="700" y="126" font-size="10.5" fill="#94a3b8">domestic &lt;8%</text>
<text x="28" y="158" font-size="11.5" font-weight="700" fill="#f1f5f9">2030 target: 35% domestic (PLI + strategic-preferential procurement)</text>
<rect x="28" y="170" width="944" height="24" rx="6" fill="#151f2e" stroke="#475569" stroke-width="1"/>
<rect x="30" y="172" width="614" height="20" rx="5" fill="#ef4444"/>
<rect x="644" y="172" width="330" height="20" rx="5" fill="#34d399"/>
<text x="520" y="186" font-size="11" font-weight="700" fill="#0b1220">65% foreign</text>
<text x="660" y="186" font-size="11" font-weight="700" fill="#0b1220">35% domestic</text>
<text x="28" y="224" font-size="11" fill="#94a3b8">HSM imports concentrate in France, the US and Germany - with a smaller China dependency for low-end RNG and side-channel test equipment.</text>
<text x="28" y="248" font-size="11" fill="#94a3b8">A single-vendor displacement event during the migration window would halt BFSI and government HSM refresh cycles for 12-18 months.</text></svg>
