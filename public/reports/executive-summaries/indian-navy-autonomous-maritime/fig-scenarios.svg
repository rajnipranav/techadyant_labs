<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="Four 2035 scenarios with probabilities: Autonomous Power 30, Indigenous but Inefficient 35, Incremental Importer 20, Drift and Dependency 15" font-family="Inter, Arial">
<rect x="0" y="0" width="1000" height="300" fill="transparent"/>
<text x="28" y="36" font-size="15" font-weight="700" fill="#f1f5f9">2035 scenario matrix — probability assessment</text>
<text x="28" y="56" font-size="11.5" fill="#94a3b8">Indigenisation trajectory × aggressiveness of scale-up</text>
<text x="286" y="99" font-size="11.5" fill="#cbd5e1" text-anchor="end">Autonomous Power (recommended)</text>
<rect x="300" y="86" width="168" height="15" rx="3.5" fill="#2E6497"/>
<text x="476.0" y="99" font-size="11.5" font-weight="700" fill="#f1f5f9">30%</text>
<text x="862" y="99" font-size="10" fill="#94a3b8">Aggressive indigenous scale-up: 80+ USVs, 25+ UUVs, 180+ n</text>
<text x="286" y="129" font-size="11.5" fill="#cbd5e1" text-anchor="end">Indigenous but Inefficient (default)</text>
<rect x="300" y="116" width="196" height="15" rx="3.5" fill="#f59e0b"/>
<text x="504.0" y="129" font-size="11.5" font-weight="700" fill="#f1f5f9">35%</text>
<text x="862" y="129" font-size="10" fill="#94a3b8">Strong indigenisation intent, slow scale-up, cost overruns</text>
<text x="286" y="159" font-size="11.5" fill="#cbd5e1" text-anchor="end">Incremental Importer</text>
<rect x="300" y="146" width="112" height="15" rx="3.5" fill="#475569"/>
<text x="420.0" y="159" font-size="11.5" font-weight="700" fill="#f1f5f9">20%</text>
<text x="862" y="159" font-size="10" fill="#94a3b8">Continued imports, reduced autonomy ambition</text>
<text x="286" y="189" font-size="11.5" fill="#cbd5e1" text-anchor="end">Drift and Dependency</text>
<rect x="300" y="176" width="84" height="15" rx="3.5" fill="#334155"/>
<text x="392.0" y="189" font-size="11.5" font-weight="700" fill="#f1f5f9">15%</text>
<text x="862" y="189" font-size="10" fill="#94a3b8">Slow pace, persistent imports, lost regional edge</text>
<text x="28" y="248" font-size="11" fill="#f59e0b">The default trajectory is not the recommended one — shifting requires DGQA reform, fab acceleration and iDEX budget tripling.</text>
<text x="28" y="272" font-size="11" fill="#94a3b8">Decisions in the 2026–2028 foundation window determine which quadrant India occupies in 2035.</text></svg>
