<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-label="Three scenarios: Mirage 20 percent 1.2 MMT, Muddle 55 percent 3.5 MMT, Machine 25 percent 5.5 MMT" font-family="Inter, Arial">
<rect x="0" y="0" width="1000" height="320" fill="transparent"/>
<text x="28" y="36" font-size="15" font-weight="700" fill="#f1f5f9">2030 scenarios - Mirage, Muddle or Machine</text>
<rect x="28" y="76" width="304" height="196" rx="12" fill="#151f2e" stroke="#ef4444" stroke-width="1.5"/>
<text x="48" y="104" font-size="14" font-weight="700" fill="#f1f5f9">Mirage</text>
<text x="48" y="126" font-size="12" font-weight="700" fill="#ef4444">20%</text>
<text x="48" y="152" font-size="11.5" fill="#cbd5e1">1.2 MMT production</text>
<text x="48" y="172" font-size="11.5" fill="#cbd5e1">8 GW installed</text>
<text x="48" y="192" font-size="11.5" fill="#cbd5e1">Rs 280/kg LCOH</text>
<text x="48" y="212" font-size="11" fill="#94a3b8">85-95% import dependency</text>
<rect x="344" y="76" width="304" height="196" rx="12" fill="#151f2e" stroke="#f59e0b" stroke-width="1.5"/>
<text x="364" y="104" font-size="14" font-weight="700" fill="#f1f5f9">Muddle (base)</text>
<text x="364" y="126" font-size="12" font-weight="700" fill="#f59e0b">55%</text>
<text x="364" y="152" font-size="11.5" fill="#cbd5e1">3.5 MMT production</text>
<text x="364" y="172" font-size="11.5" fill="#cbd5e1">35 GW installed</text>
<text x="364" y="192" font-size="11.5" fill="#cbd5e1">Rs 195/kg LCOH</text>
<text x="364" y="212" font-size="11" fill="#94a3b8">55-65% stack-import dependency</text>
<rect x="660" y="76" width="304" height="196" rx="12" fill="#151f2e" stroke="#3DD68C" stroke-width="1.5"/>
<text x="680" y="104" font-size="14" font-weight="700" fill="#f1f5f9">Machine</text>
<text x="680" y="126" font-size="12" font-weight="700" fill="#3DD68C">25%</text>
<text x="680" y="152" font-size="11.5" fill="#cbd5e1">5.5 MMT production</text>
<text x="680" y="172" font-size="11.5" fill="#cbd5e1">65 GW installed</text>
<text x="680" y="192" font-size="11.5" fill="#cbd5e1">Rs 140/kg LCOH</text>
<text x="680" y="212" font-size="11" fill="#94a3b8">30-40% import dependency</text>
<text x="28" y="296" font-size="11" fill="#94a3b8">Only Machine reaches the 5 MMT target on time; it requires all four supply-side interventions executed by 2027. CO2 abatement: Muddle 22 MtCO2/yr vs Machine 48 MtCO2/yr.</text></svg>
