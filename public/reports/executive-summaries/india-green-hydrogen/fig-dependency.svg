<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-label="Electrolyser value chain import dependency: PFSA 100, catalysts 100, AEM separators 90, PTL 85, titanium 60" font-family="Inter, Arial">
<rect x="0" y="0" width="1000" height="320" fill="transparent"/>
<text x="28" y="36" font-size="15" font-weight="700" fill="#f1f5f9">Electrolyser value chain - import dependency</text>
<text x="28" y="56" font-size="11.5" fill="#94a3b8">Ten of nineteen components are High or Critical strategic risk</text>
<text x="326" y="89" font-size="11" fill="#cbd5e1" text-anchor="end">PFSA membranes (Nafion - 3 firms)</text>
<rect x="340" y="76" width="520" height="15" rx="3.5" fill="#ef4444"/>
<text x="868.0" y="89" font-size="11" font-weight="700" fill="#f1f5f9">100%</text>
<text x="880" y="89" font-size="9.5" fill="#94a3b8">Chemours, 3M, Solvay hold the IP</text>
<text x="326" y="119" font-size="11" fill="#cbd5e1" text-anchor="end">Iridium / platinum catalysts</text>
<rect x="340" y="106" width="520" height="15" rx="3.5" fill="#ef4444"/>
<text x="868.0" y="119" font-size="11" font-weight="700" fill="#f1f5f9">100%</text>
<text x="880" y="119" font-size="9.5" fill="#94a3b8">India produces zero PGM</text>
<text x="326" y="149" font-size="11" fill="#cbd5e1" text-anchor="end">AEM separators (Zirfon)</text>
<rect x="340" y="136" width="468" height="15" rx="3.5" fill="#ef4444"/>
<text x="816.0" y="149" font-size="11" font-weight="700" fill="#f1f5f9">90%</text>
<text x="880" y="149" font-size="9.5" fill="#94a3b8">Agfa (Belgium) - 100% imported</text>
<text x="326" y="179" font-size="11" fill="#cbd5e1" text-anchor="end">Porous transport layers</text>
<rect x="340" y="166" width="442" height="15" rx="3.5" fill="#ef4444"/>
<text x="790.0" y="179" font-size="11" font-weight="700" fill="#f1f5f9">85%</text>
<text x="880" y="179" font-size="9.5" fill="#94a3b8">Ti-based; 80-100% import-dependent</text>
<text x="326" y="209" font-size="11" fill="#cbd5e1" text-anchor="end">Titanium sponge / zirconium</text>
<rect x="340" y="196" width="312" height="15" rx="3.5" fill="#f59e0b"/>
<text x="660.0" y="209" font-size="11" font-weight="700" fill="#f1f5f9">60%</text>
<text x="880" y="209" font-size="9.5" fill="#94a3b8">India processing share 0-3%</text>
<text x="326" y="239" font-size="11" fill="#cbd5e1" text-anchor="end">Stack assembly (BoP balance)</text>
<rect x="340" y="226" width="286" height="15" rx="3.5" fill="#3b82f6"/>
<text x="634.0" y="239" font-size="11" font-weight="700" fill="#f1f5f9">55%</text>
<text x="880" y="239" font-size="9.5" fill="#94a3b8">final assembly dominant; stack IP import</text>
<text x="28" y="278" font-size="11" fill="#94a3b8">Critical-materials exposure extends to scandium (SOEC interconnects), rare earths (catalyst supports) and graphite (bipolar plates) - each with 0-3% Indian processing share.</text>
<text x="28" y="302" font-size="11" fill="#94a3b8">Kerala, Tamil Nadu and Odisha beach-sand monazite reserves - thorium, rare earths, zirconium - remain largely unmined.</text></svg>
