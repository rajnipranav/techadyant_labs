<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="Capital allocation: Tier 1 35 percent, Tier 2 40 percent, Tier 3 18 percent, cross-cutting 7 percent" font-family="Inter, Arial">
<rect x="0" y="0" width="1000" height="300" fill="transparent"/>
<text x="28" y="36" font-size="15" font-weight="700" fill="#f1f5f9">Recommended capital allocation, 2026-2035</text>
<text x="28" y="56" font-size="11.5" fill="#94a3b8">Inverted from current patterns - the bulk of private capital today sits in modules</text>
<text x="286" y="97" font-size="11.5" fill="#cbd5e1" text-anchor="end">Tier 1 - Act Now (private)</text>
<rect x="300" y="84" width="192" height="16" rx="3.5" fill="#E8A33D"/>
<text x="500.5" y="97" font-size="11.5" font-weight="700" fill="#f1f5f9">35%</text>
<text x="880" y="97" font-size="9.5" fill="#94a3b8">glass, gases, chemicals, encapsulants, frames,</text>
<text x="286" y="135" font-size="11.5" fill="#cbd5e1" text-anchor="end">Tier 2 - Co-Invest (PLI)</text>
<rect x="300" y="122" width="220" height="16" rx="3.5" fill="#2E6497"/>
<text x="528.0" y="135" font-size="11.5" font-weight="700" fill="#f1f5f9">40%</text>
<text x="880" y="135" font-size="9.5" fill="#94a3b8">TOPCon/HJT cells, wafers, ingots, test and met</text>
<text x="286" y="173" font-size="11.5" fill="#cbd5e1" text-anchor="end">Tier 3 - Sovereign patience</text>
<rect x="300" y="160" width="99" height="16" rx="3.5" fill="#475569"/>
<text x="407.0" y="173" font-size="11.5" font-weight="700" fill="#f1f5f9">18%</text>
<text x="880" y="173" font-size="9.5" fill="#94a3b8">polysilicon, manufacturing equipment, tandem p</text>
<text x="286" y="211" font-size="11.5" fill="#cbd5e1" text-anchor="end">Cross-cutting</text>
<rect x="300" y="198" width="38" height="16" rx="3.5" fill="#334155"/>
<text x="346.5" y="211" font-size="11.5" font-weight="700" fill="#f1f5f9">7%</text>
<text x="880" y="211" font-size="9.5" fill="#94a3b8">research, test infrastructure, standards bodie</text>
<text x="28" y="282" font-size="11" fill="#94a3b8">Tier 2 (40%) deserves the largest stake - where India’s solar sovereignty is won or lost, and where government co-investment de-risks the equity check.</text></svg>
