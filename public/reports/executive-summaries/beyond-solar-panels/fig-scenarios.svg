<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-label="Three scenarios: Status Quo 60 percent, Geopolitical Disruption 25 percent, Technology Inflection 15 percent" font-family="Inter, Arial">
<rect x="0" y="0" width="1000" height="320" fill="transparent"/>
<text x="28" y="36" font-size="15" font-weight="700" fill="#f1f5f9">Three scenarios, one robust strategy</text>
<text x="28" y="56" font-size="11.5" fill="#94a3b8">Upstream localisation is the right strategy under all three outcomes</text>
<text x="266" y="97" font-size="11.5" fill="#cbd5e1" text-anchor="end">Status Quo</text>
<rect x="280" y="84" width="336" height="16" rx="3.5" fill="#E8A33D"/>
<text x="624.0" y="97" font-size="11.5" font-weight="700" fill="#f1f5f9">60%</text>
<text x="862" y="97" font-size="9.5" fill="#94a3b8">Gradual downstream localisation; GDP leakage ₹1.2 la</text>
<text x="266" y="135" font-size="11.5" fill="#cbd5e1" text-anchor="end">Geopolitical Disruption</text>
<rect x="280" y="122" width="140" height="16" rx="3.5" fill="#ef4444"/>
<text x="428.0" y="135" font-size="11.5" font-weight="700" fill="#f1f5f9">25%</text>
<text x="862" y="135" font-size="9.5" fill="#94a3b8">Western tariffs on Chinese solar; wafer/polysilicon </text>
<text x="266" y="173" font-size="11.5" fill="#cbd5e1" text-anchor="end">Technology Inflection</text>
<rect x="280" y="160" width="84" height="16" rx="3.5" fill="#2E6497"/>
<text x="372.0" y="173" font-size="11.5" font-weight="700" fill="#f1f5f9">15%</text>
<text x="862" y="173" font-size="9.5" fill="#94a3b8">Perovskite-silicon tandem crosses 30% efficiency by </text>
<text x="28" y="262" font-size="11" fill="#94a3b8">In Status Quo localisation captures GDP; in Disruption it removes the most acute exposure; in Inflection it lets India join the next technology cycle.</text>
<text x="28" y="290" font-size="11" fill="#94a3b8">Deployment: ~340 GW installed 2026-2035 → 430+ GW cumulative; domestic share of build-out 50% → 80-90%, but value capture only 25% → 55-65%.</text></svg>
