<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" font-family="'Calibri','Helvetica',sans-serif" preserveAspectRatio="xMidYMid meet">
<title>Combat Autonomy Maturity Model (CAMM)</title><rect width="1000" height="450" fill="#FFFFFF"/><text x="500.0" y="36" font-size="20" font-weight="bold" fill="#0B2545" text-anchor="middle">Combat Autonomy Maturity Model™ (CAMM)</text><text x="500.0" y="58" font-size="12" fill="#6B7280" text-anchor="middle">Levels 0-6 — From fully manual to cognitive autonomous</text><rect x="30" y="138" width="130" height="130" fill="#E5E7EB" stroke="none" rx="3"/><text x="95.0" y="163" font-size="22" font-weight="bold" fill="#1F2937" text-anchor="middle">L0</text><text x="95.0" y="188" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Manual</text><text x="95.0" y="213" font-size="10" fill="#1F2937" text-anchor="middle">Human-in-loop, fully</text><text x="95.0" y="227" font-size="10" fill="#1F2937" text-anchor="middle">piloted</text><text x="95.0" y="288" font-size="10" font-weight="bold" fill="#E89E1B" text-anchor="middle">India</text><text x="95.0" y="302" font-size="9" fill="#1F2937" text-anchor="middle">Tejas Mk1A</text><text x="95.0" y="314" font-size="9" fill="#1F2937" text-anchor="middle">Su-30 MKI</text><rect x="165" y="130" width="130" height="130" fill="#A0C4D9" stroke="none" rx="3"/><text x="230.0" y="155" font-size="22" font-weight="bold" fill="#1F2937" text-anchor="middle">L1</text><text x="230.0" y="180" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Assisted</text><text x="230.0" y="205" font-size="10" fill="#1F2937" text-anchor="middle">Autopilot, fly-by-wire</text><text x="230.0" y="219" font-size="10" fill="#1F2937" text-anchor="middle">aids</text><text x="230.0" y="280" font-size="10" font-weight="bold" fill="#E89E1B" text-anchor="middle">India</text><text x="230.0" y="294" font-size="9" fill="#1F2937" text-anchor="middle">Tejas Mk2 (planned)</text><rect x="300" y="122" width="130" height="130" fill="#5B8DB8" stroke="none" rx="3"/><text x="365.0" y="147" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">L2</text><text x="365.0" y="172" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Delegated</text><text x="365.0" y="197" font-size="10" fill="#FFFFFF" text-anchor="middle">Pre-programmed mission</text><text x="365.0" y="211" font-size="10" fill="#FFFFFF" text-anchor="middle">legs</text><text x="365.0" y="272" font-size="10" font-weight="bold" fill="#E89E1B" text-anchor="middle">India</text><text x="365.0" y="286" font-size="9" fill="#1F2937" text-anchor="middle">TAPAS-BH</text><text x="365.0" y="298" font-size="9" fill="#1F2937" text-anchor="middle">Rustom-II</text><rect x="435" y="114" width="130" height="130" fill="#B97A12" stroke="none" rx="3"/><text x="500.0" y="139" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">L3</text><text x="500.0" y="164" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Supervised</text><text x="500.0" y="189" font-size="10" fill="#FFFFFF" text-anchor="middle">Human supervises</text><text x="500.0" y="203" font-size="10" fill="#FFFFFF" text-anchor="middle">autonomous execution</text><text x="500.0" y="264" font-size="10" font-weight="bold" fill="#E89E1B" text-anchor="middle">India</text><text x="500.0" y="278" font-size="9" fill="#1F2937" text-anchor="middle">CATS Warrior (target)</text><text x="500.0" y="290" font-size="9" fill="#1F2937" text-anchor="middle">Ghatak (target)</text><rect x="570" y="106" width="130" height="130" fill="#E89E1B" stroke="none" rx="3"/><text x="635.0" y="131" font-size="22" font-weight="bold" fill="#1F2937" text-anchor="middle">L4</text><text x="635.0" y="156" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">Collaborative</text><text x="635.0" y="181" font-size="10" fill="#1F2937" text-anchor="middle">MUM-T; pilot + loyal</text><text x="635.0" y="195" font-size="10" fill="#1F2937" text-anchor="middle">wingman teaming</text><text x="635.0" y="256" font-size="10" font-weight="bold" fill="#E89E1B" text-anchor="middle">India</text><text x="635.0" y="270" font-size="9" fill="#1F2937" text-anchor="middle">CATS Family (2030 target)</text><rect x="705" y="98" width="130" height="130" fill="#1F4E79" stroke="none" rx="3"/><text x="770.0" y="123" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">L5</text><text x="770.0" y="148" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Autonomous Swarm</text><text x="770.0" y="173" font-size="10" fill="#FFFFFF" text-anchor="middle">Multi-agent self-</text><text x="770.0" y="187" font-size="10" fill="#FFFFFF" text-anchor="middle">coordination</text><text x="770.0" y="248" font-size="10" font-weight="bold" fill="#E89E1B" text-anchor="middle">India</text><text x="770.0" y="262" font-size="9" fill="#1F2937" text-anchor="middle">ARCHINAUT Swarm (target)</text><rect x="840" y="90" width="130" height="130" fill="#0B2545" stroke="none" rx="3"/><text x="905.0" y="115" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">L6</text><text x="905.0" y="140" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Cognitive Autonomy</text><text x="905.0" y="165" font-size="10" fill="#FFFFFF" text-anchor="middle">Mission-level self-</text><text x="905.0" y="179" font-size="10" fill="#FFFFFF" text-anchor="middle">adaptation</text><text x="905.0" y="240" font-size="10" font-weight="bold" fill="#E89E1B" text-anchor="middle">India</text><text x="905.0" y="254" font-size="9" fill="#1F2937" text-anchor="middle">—</text><rect x="30" y="380" width="940" height="50" fill="#F7F7F4" stroke="#0B2545" stroke-width="1" rx="3"/><text x="500.0" y="402" font-size="12" font-weight="bold" fill="#0B2545" text-anchor="middle">India 2026: CAMM Level 2.1 average (Delegated, transitioning to Supervised)</text><text x="500.0" y="420" font-size="11" fill="#6B7280" text-anchor="middle">India 2035 target: CAMM Level 4.0 (Collaborative MUM-T as default)</text><text x="500.0" y="440" font-size="10" fill="#6B7280" text-anchor="middle" font-style="italic">Source: Techadyant Labs Combat Autonomy Maturity Model. USAF equivalent target: L4-L5 by 2030.</text></svg>
