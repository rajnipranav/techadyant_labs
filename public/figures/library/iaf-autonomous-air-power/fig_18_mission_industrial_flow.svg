<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" font-family="'Calibri','Helvetica',sans-serif" preserveAspectRatio="xMidYMid meet">
<title>Mission-to-Industrial Flow</title><rect width="1100" height="500" fill="#FFFFFF"/><text x="550.0" y="36" font-size="20" font-weight="bold" fill="#0B2545" text-anchor="middle">Mission → Capability → Technology → Industrial → Supply Chain → Opportunity → Outlook</text><text x="550.0" y="58" font-size="12" fill="#6B7280" text-anchor="middle">Techadyant Labs 7-step analytical framework — applied to each chapter of this report.</text><rect x="40" y="200" width="130" height="90" fill="#0B2545" rx="5"/><text x="105.0" y="230" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MISSION</text><text x="105.0" y="250" font-size="9" fill="#FFFFFF" text-anchor="middle">Air Defence ·</text><text x="105.0" y="264" font-size="9" fill="#FFFFFF" text-anchor="middle">Strike · SEAD ·</text><text x="105.0" y="278" font-size="9" fill="#FFFFFF" text-anchor="middle">ISR</text><line x1="170" y1="245.0" x2="182" y2="245.0" stroke="#0B2545" stroke-width="2"/><polygon points="182,241.0 188,245.0 182,249.0" fill="#0B2545"/><rect x="185" y="200" width="130" height="90" fill="#B97A12" rx="5"/><text x="250.0" y="230" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CAPABILITY</text><text x="250.0" y="250" font-size="9" fill="#FFFFFF" text-anchor="middle">UCAV · CCA · Swarm</text><text x="250.0" y="264" font-size="9" fill="#FFFFFF" text-anchor="middle">· HALE · HAPS</text><line x1="315" y1="245.0" x2="327" y2="245.0" stroke="#0B2545" stroke-width="2"/><polygon points="327,241.0 333,245.0 327,249.0" fill="#0B2545"/><rect x="330" y="200" width="130" height="90" fill="#E89E1B" rx="5"/><text x="395.0" y="230" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">TECHNOLOGY</text><text x="395.0" y="250" font-size="9" fill="#1F2937" text-anchor="middle">AI · Semicon ·</text><text x="395.0" y="264" font-size="9" fill="#1F2937" text-anchor="middle">Avionics · Engines</text><line x1="460" y1="245.0" x2="472" y2="245.0" stroke="#0B2545" stroke-width="2"/><polygon points="472,241.0 478,245.0 472,249.0" fill="#0B2545"/><rect x="475" y="200" width="130" height="90" fill="#5B8DB8" rx="5"/><text x="540.0" y="230" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">INDUSTRIAL</text><text x="540.0" y="250" font-size="9" fill="#FFFFFF" text-anchor="middle">HAL · DRDO · BEL ·</text><text x="540.0" y="264" font-size="9" fill="#FFFFFF" text-anchor="middle">Private · Startups</text><line x1="605" y1="245.0" x2="617" y2="245.0" stroke="#0B2545" stroke-width="2"/><polygon points="617,241.0 623,245.0 617,249.0" fill="#0B2545"/><rect x="620" y="200" width="130" height="90" fill="#7BA7C9" rx="5"/><text x="685.0" y="230" font-size="13" font-weight="bold" fill="#1F2937" text-anchor="middle">SUPPLY CHAIN</text><text x="685.0" y="250" font-size="9" fill="#1F2937" text-anchor="middle">Dependencies ·</text><text x="685.0" y="264" font-size="9" fill="#1F2937" text-anchor="middle">Materials ·</text><text x="685.0" y="278" font-size="9" fill="#1F2937" text-anchor="middle">Vendors</text><line x1="750" y1="245.0" x2="762" y2="245.0" stroke="#0B2545" stroke-width="2"/><polygon points="762,241.0 768,245.0 762,249.0" fill="#0B2545"/><rect x="765" y="200" width="130" height="90" fill="#D4820A" rx="5"/><text x="830.0" y="230" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OPPORTUNITY</text><text x="830.0" y="250" font-size="9" fill="#FFFFFF" text-anchor="middle">75 IOSM-scored</text><text x="830.0" y="264" font-size="9" fill="#FFFFFF" text-anchor="middle">surfaces</text><line x1="895" y1="245.0" x2="907" y2="245.0" stroke="#0B2545" stroke-width="2"/><polygon points="907,241.0 913,245.0 907,249.0" fill="#0B2545"/><rect x="910" y="200" width="130" height="90" fill="#1B7D46" rx="5"/><text x="975.0" y="230" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">OUTLOOK</text><text x="975.0" y="250" font-size="9" fill="#FFFFFF" text-anchor="middle">India 2035</text><text x="975.0" y="264" font-size="9" fill="#FFFFFF" text-anchor="middle">strategic posture</text><text x="550.0" y="335" font-size="13" font-weight="bold" fill="#0B2545" text-anchor="middle">Worked example: SEAD → CATS Hunter → GPS-denied nav → BEL/TASL/DARE → IR detector + IMU → IOSM #6 → 2035 SEAD posture</text><rect x="40" y="350" width="1020" height="60" fill="#F7F7F4" stroke="#0B2545" stroke-width="1.5" stroke-dasharray="4,3" rx="3"/><text x="60" y="375" font-size="11" fill="#1F2937">Mission trace: SEAD (suppress enemy air defences) → CATS Hunter loitering munition (capability)</text><text x="60" y="392" font-size="11" fill="#1F2937">→ GPS-denied navigation + terminal seeker (technology) → DARE + BEL + Startup (industrial) → IMU + IR detector (supply chain)</text><text x="60" y="408" font-size="11" fill="#1F2937">→ IOSM Opportunity "GPS-denied nav" (opportunity) → 2035 SEAD self-sufficient (outlook)</text><text x="550.0" y="485" font-size="10" fill="#6B7280" text-anchor="middle" font-style="italic">Each chapter traces this 7-step flow. Gaps cascade downward (e.g., IMU dependency → limits CATS Hunter → limits SEAD capability).</text></svg>
