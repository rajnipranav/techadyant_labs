<title>CATS Family of Systems Architecture</title><rect width="950" height="600" fill="#FFFFFF"/><text x="475.0" y="36" font-size="20" font-weight="bold" fill="#0B2545" text-anchor="middle">CATS Family of Systems — Architecture</text><text x="475.0" y="58" font-size="12" fill="#6B7280" text-anchor="middle">Combat Air Teaming System — IAF Manned-Unmanned Teaming Concept</text><rect x="375" y="90" width="200" height="60" fill="#0B2545" rx="5"/><text x="475" y="115" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CATS Mothership</text><text x="475" y="135" font-size="11" fill="#FFFFFF" text-anchor="middle">Carrier (in dev, 2032 IOC)</text><rect x="60" y="90" width="180" height="60" fill="#E89E1B" rx="5"/><text x="150" y="115" font-size="14" font-weight="bold" fill="#1F2937" text-anchor="middle">Manned Fighter Lead</text><text x="150" y="135" font-size="11" fill="#1F2937" text-anchor="middle">Tejas Mk1A / Mk2 / AMCA</text><line x1="240" y1="120" x2="375" y2="120" stroke="#0B2545" stroke-width="2" stroke-dasharray="4,3"/><rect x="60" y="240" width="180" height="55" fill="#5B8DB8" rx="5"/><text x="150" y="262" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CATS Warrior</text><text x="150" y="282" font-size="10" fill="#FFFFFF" text-anchor="middle">Loyal Wingman (×4-6)</text><rect x="280" y="240" width="180" height="55" fill="#5B8DB8" rx="5"/><text x="370" y="262" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CATS Warrior</text><text x="370" y="282" font-size="10" fill="#FFFFFF" text-anchor="middle">Loyal Wingman (×4-6)</text><rect x="500" y="240" width="180" height="55" fill="#5B8DB8" rx="5"/><text x="590" y="262" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CATS Warrior</text><text x="590" y="282" font-size="10" fill="#FFFFFF" text-anchor="middle">Loyal Wingman (×4-6)</text><rect x="60" y="340" width="180" height="55" fill="#B97A12" rx="5"/><text x="150" y="362" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CATS Hunter</text><text x="150" y="382" font-size="10" fill="#FFFFFF" text-anchor="middle">Loitering Munition (~300 km)</text><rect x="280" y="340" width="180" height="55" fill="#B97A12" rx="5"/><text x="370" y="362" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CATS Hunter</text><text x="370" y="382" font-size="10" fill="#FFFFFF" text-anchor="middle">Loitering Munition (~300 km)</text><rect x="60" y="440" width="400" height="55" fill="#7BA7C9" rx="5"/><text x="260" y="462" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CATS Air-Launched Effectors</text><text x="260" y="482" font-size="10" fill="#FFFFFF" text-anchor="middle">Expendable ISR / EW / Strike (×10+)</text><rect x="640" y="240" width="270" height="160" fill="#F7F7F4" stroke="#0B2545" stroke-width="2" rx="5"/><text x="775" y="265" font-size="13" font-weight="bold" fill="#0B2545" text-anchor="middle">Mission &amp; Control Layer</text><text x="660" y="285" font-size="11" fill="#1F2937">• Manned cockpit — decision authority</text><text x="660" y="310" font-size="11" fill="#1F2937">• Tactical data link — LPI/LPD</text><text x="660" y="335" font-size="11" fill="#1F2937">• Sensor fusion — multi-source</text><text x="660" y="360" font-size="11" fill="#1F2937">• AI copilot — target nomination</text><text x="660" y="385" font-size="11" fill="#1F2937">• Swarm coordinator — RL tactics</text><line x1="150" y1="150" x2="150" y2="240" stroke="#0B2545" stroke-width="1.5" stroke-dasharray="3,3"/><line x1="370" y1="150" x2="370" y2="240" stroke="#0B2545" stroke-width="1.5" stroke-dasharray="3,3"/><line x1="590" y1="150" x2="590" y2="240" stroke="#0B2545" stroke-width="1.5" stroke-dasharray="3,3"/><line x1="150" y1="295" x2="150" y2="340" stroke="#6B7280" stroke-width="1" stroke-dasharray="2,2"/><line x1="370" y1="295" x2="370" y2="340" stroke="#6B7280" stroke-width="1" stroke-dasharray="2,2"/><text x="60" y="540" font-size="11" fill="#6B7280">Legend: Orange = Manned lead · Navy = Carrier · Steel = Loyal Wingman · Burnt-orange = Loitering · Blue = Expendable</text><text x="60" y="565" font-size="10" fill="#6B7280" font-style="italic">Source: IAF CATS concept (Aero India 2021); HAL brochures; Techadyant Labs analytical architecture.</text></svg>
