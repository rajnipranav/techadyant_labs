<title>Autonomous Air Power Stack</title><rect width="900" height="700" fill="#FFFFFF"/><text x="450.0" y="40" font-size="20" font-weight="bold" fill="#0B2545" text-anchor="middle">Autonomous Air Power Stack™ — 7 Layers</text><text x="450.0" y="62" font-size="12" fill="#6B7280" text-anchor="middle">Techadyant Labs Proprietary Framework — Mission → Capability → Technology → Industrial → Supply Chain → Opportunity → Outlook</text><rect x="60" y="600" width="780" height="70" fill="#0B2545" stroke="none" rx="3"/><circle cx="90" cy="635.0" r="18" fill="#FFFFFF" stroke="#0B2545" stroke-width="2"/><text x="90" y="640.0" font-size="16" font-weight="bold" fill="#0B2545" text-anchor="middle">1</text><text x="130" y="630" font-size="16" font-weight="bold" fill="#FFFFFF">OUTLOOK</text><text x="130" y="652" font-size="12" fill="#FFFFFF">Strategic Outlook — Capability Vision 2035</text><text x="830" y="645" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="end">Layer 7</text><rect x="60" y="520" width="780" height="70" fill="#5B8DB8" stroke="none" rx="3"/><circle cx="90" cy="555.0" r="18" fill="#FFFFFF" stroke="#5B8DB8" stroke-width="2"/><text x="90" y="560.0" font-size="16" font-weight="bold" fill="#5B8DB8" text-anchor="middle">2</text><text x="130" y="550" font-size="16" font-weight="bold" fill="#FFFFFF">OPPORTUNITY</text><text x="130" y="572" font-size="12" fill="#FFFFFF">Opportunity Surfaces — IOSM, Industrial Capture</text><text x="830" y="565" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="end">Layer 6</text><rect x="60" y="440" width="780" height="70" fill="#7BA7C9" stroke="none" rx="3"/><circle cx="90" cy="475.0" r="18" fill="#FFFFFF" stroke="#7BA7C9" stroke-width="2"/><text x="90" y="480.0" font-size="16" font-weight="bold" fill="#7BA7C9" text-anchor="middle">3</text><text x="130" y="470" font-size="16" font-weight="bold" fill="#1F2937">SUPPLY CHAIN</text><text x="130" y="492" font-size="12" fill="#1F2937">Supply Chain — Dependencies, Materials, Critical Vendors</text><text x="830" y="485" font-size="11" font-style="italic" fill="#1F2937" text-anchor="end">Layer 5</text><rect x="60" y="360" width="780" height="70" fill="#A0C4D9" stroke="none" rx="3"/><circle cx="90" cy="395.0" r="18" fill="#FFFFFF" stroke="#A0C4D9" stroke-width="2"/><text x="90" y="400.0" font-size="16" font-weight="bold" fill="#A0C4D9" text-anchor="middle">4</text><text x="130" y="390" font-size="16" font-weight="bold" fill="#1F2937">INDUSTRIAL</text><text x="130" y="412" font-size="12" fill="#1F2937">Industrial Ecosystem — HAL, DRDO, BEL, Private, Startups</text><text x="830" y="405" font-size="11" font-style="italic" fill="#1F2937" text-anchor="end">Layer 4 — ADIE™</text><rect x="60" y="280" width="780" height="70" fill="#E89E1B" stroke="none" rx="3"/><circle cx="90" cy="315.0" r="18" fill="#FFFFFF" stroke="#E89E1B" stroke-width="2"/><text x="90" y="320.0" font-size="16" font-weight="bold" fill="#E89E1B" text-anchor="middle">5</text><text x="130" y="310" font-size="16" font-weight="bold" fill="#1F2937">TECHNOLOGY</text><text x="130" y="332" font-size="12" fill="#1F2937">Technology Stack — AI, Semicon, Avionics, Sensors, Propulsion</text><text x="830" y="325" font-size="11" font-style="italic" fill="#1F2937" text-anchor="end">Layer 3 — Tech Stack</text><rect x="60" y="200" width="780" height="70" fill="#B97A12" stroke="none" rx="3"/><circle cx="90" cy="235.0" r="18" fill="#FFFFFF" stroke="#B97A12" stroke-width="2"/><text x="90" y="240.0" font-size="16" font-weight="bold" fill="#B97A12" text-anchor="middle">6</text><text x="130" y="230" font-size="16" font-weight="bold" fill="#FFFFFF">CAPABILITY</text><text x="130" y="252" font-size="12" fill="#FFFFFF">Capability Layer — UCAV, CCA, Swarm, ISR, EW, Strike</text><text x="830" y="245" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="end">Layer 2 — CAMM™</text><rect x="60" y="120" width="780" height="70" fill="#0B2545" stroke="none" rx="3"/><circle cx="90" cy="155.0" r="18" fill="#FFFFFF" stroke="#0B2545" stroke-width="2"/><text x="90" y="160.0" font-size="16" font-weight="bold" fill="#0B2545" text-anchor="middle">7</text><text x="130" y="150" font-size="16" font-weight="bold" fill="#FFFFFF">MISSION</text><text x="130" y="172" font-size="12" fill="#FFFFFF">Mission Layer — Air Defence, Strike, SEAD, ISR, Power Projection</text><text x="830" y="165" font-size="11" font-style="italic" fill="#FFFFFF" text-anchor="end">Layer 1</text><text x="450.0" y="675" font-size="10" fill="#6B7280" text-anchor="middle">Source: Techadyant Labs framework. Each layer informs the next; gaps cascade downward.</text></svg>
