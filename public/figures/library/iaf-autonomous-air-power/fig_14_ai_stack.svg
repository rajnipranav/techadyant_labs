  <text class="st0" transform="translate(283.15 38.69)"><tspan x="0" y="0">AI Capability Stack for Air Operations</tspan></text>
  <text class="st4" transform="translate(293.37 60.69)"><tspan x="0" y="0">7-layer stack — from sensors to cognitive decision support.</tspan></text>
  <rect class="st9" x="61.37" y="90.46" width="700" height="50" rx="3" ry="3"/>
  <text class="st2" transform="translate(76.37 112.46)"><tspan x="0" y="0">L7 — Cognitive Decision Support</tspan></text>
  <text class="st1" transform="translate(76.37 130.46)"><tspan x="0" y="0">AI copilot; target nomination; mission re-planning</tspan></text>
  <rect class="st15" x="61.37" y="150.46" width="700" height="50" rx="3" ry="3"/>
  <text class="st2" transform="translate(76.37 172.46)"><tspan x="0" y="0">L6 — Mission Planning &amp; Rehearsal</tspan></text>
