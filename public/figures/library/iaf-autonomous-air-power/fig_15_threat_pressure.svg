nt-weight="bold" fill="#B97A12">China DEW / counter-UAS</text><circle cx="380.0" cy="328.0" r="10" fill="#B97A12" fill-opacity="0.5" stroke="#B97A12" stroke-width="2"/><text x="395.0" y="332.0" font-size="10" font-weight="bold" fill="#B97A12">Pakistan AEW&amp;C (Karakoram Eagle)</text><circle cx="450.0" cy="214.0" r="18" fill="#0B2545" fill-opacity="0.2" stroke="#0B2545" stroke-width="2.5" stroke-dasharray="3,2"/><text x="475.0" y="218.0" font-size="11" font-weight="bold" fill="#0B2545">India current autonomous air capability (composite)</text><text x="450.0" y="585" font-size="10" fill="#6B7280" text-anchor="middle" font-style="italic">Bubble size = capability gap relative to threat. India trails all top-quadrant threats on both severity and time-to-materialise.</text></svg>
