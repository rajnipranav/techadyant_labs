<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1200" height="720" fill="white"/>
