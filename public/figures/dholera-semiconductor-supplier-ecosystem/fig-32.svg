  <rect x="900" y="250" width="280" height="80" fill="#F5F8FC" stroke="#D6E1EC" stroke-width="1" rx="4"/>
  <text x="920" y="272" fill="#0A2540" font-size="11" font-weight="bold">1. Specialty gases JV — niche</text>
