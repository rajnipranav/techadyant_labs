  <text x="920" y="312" fill="#5B6B7D" font-size="10">Founder fit: chem eng + IP.</text>

  <rect x="900" y="345" width="280" height="80" fill="#F5F8FC" stroke="#D6E1EC" stroke-width="1" rx="4"/>
  <text x="920" y="367" fill="#0A2540" font-size="11" font-weight="bold">2. Equipment service &amp; calibration</text>
  <text x="920" y="383" fill="#0A2540" font-size="11" font-weight="bold">for installed base.</text>
  <text x="920" y="407" fill="#5B6B7D" font-size="10">Founder fit: ex-fab engineers.</text>

  <rect x="900" y="440" width="280" height="80" fill="#F5F8FC" stroke="#D6E1EC" stroke-width="1" rx="4"/>
  <text x="920" y="462" fill="#0A2540" font-size="11" font-weight="bold">3. UPW / ZLD services with</text>
  <text x="920" y="478" fill="#0A2540" font-size="11" font-weight="bold">analytics &amp; predictive maint.</text>
  <text x="920" y="502" fill="#5B6B7D" font-size="10">Founder fit: water + IoT.</text>

  <!-- Footer -->
  <rect x="40" y="660" width="1120" height="34" fill="#F5F8FC" stroke="#D6E1EC" stroke-width="1"/>
  <text x="600" y="682" fill="#2C3E50" font-size="11" text-anchor="middle">Strategic action set: 12 recommendations across 4 audience segments. Owner &amp; horizon specified per item.</text>
