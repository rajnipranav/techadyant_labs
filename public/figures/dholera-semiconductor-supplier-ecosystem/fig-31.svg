<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1200" height="600" fill="white"/>
  <!-- Title strip -->
  <rect x="40" y="20" width="1120" height="34" fill="#0A2540"/>
  <text x="600" y="42" fill="white" font-size="14" font-weight="bold" text-anchor="middle">Semiconductor Value Chain — Strategic Control Points &amp; Dholera Localisation Opportunity</text>

  <!-- Layer labels (left) -->
  <g font-size="11" fill="#2C3E50">
    <text x="60" y="100" font-weight="bold">Design &amp; IP</text>
    <text x="60" y="170" font-weight="bold">Wafer Fab</text>
    <text x="60" y="240" font-weight="bold">Materials</text>
    <text x="60" y="310" font-weight="bold">Equipment</text>
    <text x="60" y="380" font-weight="bold">Packaging (OSAT)</text>
    <text x="60" y="450" font-weight="bold">Logistics &amp; Service</text>
    <text x="60" y="520" font-weight="bold">End Markets</text>
  </g>

  <!-- Layer bands -->
  <rect x="180" y="80"  width="980" height="40" fill="#F5F8FC" rx="4"/>
  <rect x="180" y="150" width="980" height="40" fill="#F5F8FC" rx="4"/>
  <rect x="180" y="220" width="980" height="40" fill="#F5F8FC" rx="4"/>
  <rect x="180" y="290" width="980" height="40" fill="#F5F8FC" rx="4"/>
  <rect x="180" y="360" width="980" height="40" fill="#F5F8FC" rx="4"/>
  <rect x="180" y="430" width="980" height="40" fill="#F5F8FC" rx="4"/>
  <rect x="180" y="500" width="980" height="40" fill="#F5F8FC" rx="4"/>

  <!-- Boxes: each is (x, w, label, india_local_pct, color) -->
  <!-- Row 1: Design -->
  <rect x="200" y="88" width="160" height="24" fill="#5DBB9C" rx="3"/>
  <text x="280" y="105" fill="white" font-size="11" font-weight="bold" text-anchor="middle">EDA / IP (India: 35%)</text>
  <rect x="380" y="88" width="160" height="24" fill="#E5A93C" rx="3"/>
  <text x="460" y="105" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Chip design (India: 20%)</text>
  <rect x="560" y="88" width="160" height="24" fill="#D65A4F" rx="3"/>
  <text x="640" y="105" fill="white" font-size="11" font-weight="bold" text-anchor="middle">EDA licences (India: 10%)</text>

  <!-- Row 2: Wafer Fab -->
  <rect x="200" y="158" width="240" height="24" fill="#D65A4F" rx="3"/>
  <text x="320" y="175" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Logic fab — Dholera (India: 5%)</text>
  <rect x="460" y="158" width="200" height="24" fill="#D65A4F" rx="3"/>
  <text x="560" y="175" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Memory fab (India: 0%)</text>
  <rect x="680" y="158" width="200" height="24" fill="#E5A93C" rx="3"/>
  <text x="780" y="175" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Analog / RF (India: 15%)</text>

  <!-- Row 3: Materials -->
  <rect x="200" y="228" width="120" height="24" fill="#D65A4F" rx="3"/>
  <text x="260" y="245" fill="white" font-size="10" font-weight="bold" text-anchor="middle">Specialty gases (8%)</text>
  <rect x="340" y="228" width="120" height="24" fill="#D65A4F" rx="3"/>
  <text x="400" y="245" fill="white" font-size="10" font-weight="bold" text-anchor="middle">Photoresist (0%)</text>
  <rect x="480" y="228" width="120" height="24" fill="#D65A4F" rx="3"/>
  <text x="540" y="245" fill="white" font-size="10" font-weight="bold" text-anchor="middle">CMP slurry (0%)</text>
  <rect x="620" y="228" width="120" height="24" fill="#E5A93C" rx="3"/>
  <text x="680" y="245" fill="white" font-size="10" font-weight="bold" text-anchor="middle">Specialty metals (20%)</text>
  <rect x="760" y="228" width="140" height="24" fill="#5DBB9C" rx="3"/>
  <text x="830" y="245" fill="white" font-size="10" font-weight="bold" text-anchor="middle">UPW / bulk chemicals (50%)</text>

  <!-- Row 4: Equipment -->
  <rect x="200" y="298" width="200" height="24" fill="#D65A4F" rx="3"/>
  <text x="300" y="315" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Lithography (India: 0%)</text>
  <rect x="420" y="298" width="200" height="24" fill="#D65A4F" rx="3"/>
  <text x="520" y="315" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Deposition (India: 5%)</text>
  <rect x="640" y="298" width="200" height="24" fill="#E5A93C" rx="3"/>
  <text x="740" y="315" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Etch / Clean (India: 15%)</text>

  <!-- Row 5: Packaging -->
  <rect x="200" y="368" width="220" height="24" fill="#E5A93C" rx="3"/>
  <text x="310" y="385" fill="white" font-size="11" font-weight="bold" text-anchor="middle">OSAT — Micron / Tata (India: 25%)</text>
  <rect x="440" y="368" width="180" height="24" fill="#D65A4F" rx="3"/>
  <text x="530" y="385" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Substrates (India: 0%)</text>
  <rect x="640" y="368" width="180" height="24" fill="#D65A4F" rx="3"/>
  <text x="730" y="385" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Packaging materials (10%)</text>

  <!-- Row 6: Logistics & Service -->
  <rect x="200" y="438" width="200" height="24" fill="#5DBB9C" rx="3"/>
  <text x="300" y="455" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Logistics &amp; hazmat (India: 60%)</text>
  <rect x="420" y="438" width="200" height="24" fill="#E5A93C" rx="3"/>
  <text x="520" y="455" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Equipment service (India: 35%)</text>
  <rect x="640" y="438" width="200" height="24" fill="#D65A4F" rx="3"/>
  <text x="740" y="455" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Calibration (India: 10%)</text>

  <!-- Row 7: End markets -->
  <rect x="200" y="508" width="200" height="24" fill="#4A90E2" rx="3"/>
  <text x="300" y="525" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Smartphones / consumer</text>
  <rect x="420" y="508" width="200" height="24" fill="#4A90E2" rx="3"/>
  <text x="520" y="525" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Automotive / industrial</text>
  <rect x="640" y="508" width="200" height="24" fill="#4A90E2" rx="3"/>
  <text x="740" y="525" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Defence / aerospace</text>
  <rect x="860" y="508" width="180" height="24" fill="#4A90E2" rx="3"/>
  <text x="950" y="525" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Data centre / AI</text>

  <!-- Legend -->
  <rect x="900" y="88" width="14" height="14" fill="#5DBB9C"/>
  <text x="922" y="100" font-size="10" fill="#2C3E50">Local ≥ 40%</text>
  <rect x="900" y="108" width="14" height="14" fill="#E5A93C"/>
  <text x="922" y="120" font-size="10" fill="#2C3E50">Local 15–40%</text>
  <rect x="900" y="128" width="14" height="14" fill="#D65A4F"/>
  <text x="922" y="140" font-size="10" fill="#2C3E50">Local &lt; 15%</text>
</svg>